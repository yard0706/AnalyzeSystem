<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en-us"

      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:pe="http://primefaces.org/ui/extensions"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <title>.:: AS ::.</title>
    <meta content='text/html; charset=UTF-8' http-equiv="Content-Type" />
    <h:outputStylesheet library="css" name="layout.css" />
    <h:outputStylesheet library="css" name="no-header-table.css" />
    <h:outputStylesheet library="webjars" name="primeflex/3.3.1/primeflex.min.css" />
    <h:outputScript library="js" name="layout.js" />
</h:head>

<h:body>
    <div class="container">
        <header class="header">
            <p:autoComplete id="folderSearch" value="#{filesMBean.foundFile}"
                            completeMethod="#{filesMBean.completeFolders}"
                            var="folder" itemLabel="#{folder.filePath}" itemValue="#{folder}"
                            converter="#{foldersConverter}" forceSelection="true" scrollHeight="600"
                            style="width: 400px;">
                <p:ajax event="itemSelect" listener="#{filesMBean.onFolderSearchSelect}" update=":sidebarForm:msgs :contentForm"/>
                <p:column>
                    <h:outputText style="vertical-align: middle; margin-left: .2rem" value="#{folder.modifyDateTime}"/>
                    <h:outputText style="vertical-align: middle; margin-left: .5rem" value="#{folder.filePath}"/>
                </p:column>
            </p:autoComplete>
            <button id="toggleSidebar" class="toggle-btn">☰</button>
        </header>

        <div class="main-content">
            <aside class="sidebar" id="sidebar">
                <h:form id="sidebarForm">
                    <p:poll interval="5" listener="#{filesMBean.updateSidebarFilesList}" update=":sidebarForm" />
                    <p:growl id="msgs" showDetail="true" skipDetailIfEqualsSummary="true"/>
                    <div class="block text-center">
                        <progress id="fileProgress" style="width: 100px; height: 20px;display:none;" indeterminate="true"/>
                    </div>

                    <p:dataTable id="filesTable" var="file" value="#{filesMBean.filesList}"
                                 sortBy="#{file.groupName}" sortOrder="desc"
                                 size="small" styleClass="hide-datatable-header"
                                 selectionMode="single"
                                 selection="#{filesMBean.selectedFile}" rowKey="#{file.id}"
                                 widgetVar="filesTableWidget"
                                 rowIndexVar="rowIndex">
                        <p:ajax event="rowSelect" listener="#{filesMBean.onRowSelect}" update=":sidebarForm:msgs :contentForm"
                                onstart="document.getElementById('fileProgress').style.display = 'block'"
                                oncomplete="document.getElementById('fileProgress').style.display = 'none'"
                        />

                        <p:headerRow field="groupName"
                                     expandable="true"
                                     sortOrder="desc"
                                     expanded="true">

                            <p:column colspan="1" style="background-color: sienna;">
                                <div class="inline-flex align-items-center" style="vertical-align: middle">
                                    <h:outputText styleClass="ml-2" value="#{file.groupName}"/>
                                </div>
                            </p:column>
                        </p:headerRow>

                        <p:column>
                            <div onclick="$(this).closest('td').click()" class="block font-bold text-left p-0">
                                <h:outputText value="#{file.fileName}" />
                            </div>
                            <div onclick="$(this).closest('td').click()" class="block text-right p-0 text-xs text-gray-400">
                                Загружен:
                                <h:outputText value="#{file.loadTime}">
                                    <f:convertDateTime pattern="dd.MM.yyyy HH:mm:ss" type="localDateTime"/>
                                </h:outputText>
                            </div>
                        </p:column>
                    </p:dataTable>

                </h:form>
            </aside>

            <main class="content">
                <h:form id="contentForm">
                    <p:toolbar>
                        <p:toolbarGroup>
                            <h:outputText value="Разделитель:" style="margin-left: 5px;"/>
                            <p:selectOneButton value="#{filesMBean.separatorChar}" style="margin-left: 10px;">
                                <f:selectItem itemLabel="," itemValue=","/>
                                <f:selectItem itemLabel=";" itemValue=";"/>
                                <f:selectItem itemLabel="|" itemValue="|"/>
                                <p:ajax event="change" listener="#{filesMBean.onChangeParams}" />
                            </p:selectOneButton>

                            <h:outputText value="Кодировка:" style="margin-left: 20px;"/>
                            <p:selectOneButton value="#{filesMBean.encoding}" style="margin-left: 10px;">
                                <f:selectItem itemLabel="UTF-8" itemValue="UTF-8"/>
                                <f:selectItem itemLabel="CP1251" itemValue="CP1251"/>
                                <p:ajax event="change" listener="#{filesMBean.onChangeParams}" />
                            </p:selectOneButton>
                            <p:commandButton type="button" icon="pi pi-bars" onclick="PF('previewDialog').show()" style="margin-left: 20px;"/>

                            <p:selectOneMenu id="countryMenu"
                                             value="#{dataViewBean.selectedFilesPattern}"
                                             style="margin-left: 20px;">
                                <f:selectItem itemLabel="Выберите шаблон..." itemValue="" />
                                <f:selectItems value="#{dataViewBean.filesPatterns}" />

                                <!-- AJAX событие при изменении выбора -->
                                <p:ajax event="change"
                                        listener="#{filesMBean.onChangeParams}"
                                        update=":contentForm:fileDataTable"
                                        process="@this"/>
                            </p:selectOneMenu>

                            <p:commandButton id="analyzeReportButton" value="Аналитика" icon="pi pi-chart-bar"
                                             styleClass="ui-button-outlined" style="margin-left: 20px;"
                                             action="#{dataViewBean.analyzeFile}"
                                             oncomplete="document.getElementById('contentForm:uploadAnalyzeReportButton').click();"
                                             update=":sidebarForm:msgs :contentForm">
                            </p:commandButton>

                            <p:commandButton id="uploadAnalyzeReportButton" value="Аналитика" style="margin-left: 20px; display: none;"
                                             update=":sidebarForm:msgs :contentForm">
                                <p:fileDownload value="#{dataViewBean.analyzedFile}"/>
                            </p:commandButton>
                        </p:toolbarGroup>

                    </p:toolbar>

                    <p:dataTable id="fileDataTable" var="data" value="#{dataViewBean.records}" widgetVar="fileDataWidget"
                                 size="small" class="text-sm"
                                 liveResize="true" resizableColumns="true"
                                 scrollable="true" style="height: calc(100vh - 250px); table-layout: fixed; max-width: calc(100vw - 300px);"
                                 frozenRows="1">

                        <p:columns value="#{dataViewBean.columns}" var="column" headerText="#{column.columnName}"
                                   style="#{column.style}">
                            <h:outputText value="#{data[column.keyColumn]}"/>
                        </p:columns>

                    </p:dataTable>

                    <p:dialog header="Первые 10 строк файла" widgetVar="previewDialog" minHeight="600" width="800" showEffect="fade" closeOnEscape="true">
                        <div class="block bg-primary font-bold text-center p-0 border-round mb-3" style="height: 300px;">
                            <p:inputTextarea
                                    value="#{filesMBean.selectedFilePreview}"
                                    style="width: 100%; height: 100%;
                                       white-space: nowrap;
                                       box-sizing: border-box;
                                       overflow-x: auto;"
                                    autoResize="false"/>
                        </div>
                    </p:dialog>
                </h:form>
            </main>
        </div>

        <footer class="footer">
            <p>© 2023 Мой сайт. Все права защищены.</p>
        </footer>
    </div>
</h:body>
</html>
