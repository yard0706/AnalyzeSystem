spring.application.name=analyzesystem
server.port=8779

spring.threads.virtual.enabled=true

joinfaces.primefaces.theme=vela
joinfaces.faces.project-stage=Production

input.folder=C:\\temp\\input
work.folder=C:\\temp\\work

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/asystem
spring.datasource.username=asystem_admin
spring.datasource.password=asystem_admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration for DDL Auto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Optional: Show SQL queries in console
spring.jpa.show-sql=true